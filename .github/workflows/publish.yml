name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已有的版本 tag，例如 v0.66.2-alpha.3'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid release tag: $tag"
            exit 1
          fi

          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag (version $version)"

  build:
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check source version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          [xml]$project = Get-Content BetterGenshinImpact/BetterGenshinImpact.csproj
          $sourceVersion = $project.Project.PropertyGroup.Version
          if ($sourceVersion -ne $env:RELEASE_VERSION) {
            throw "Tag version $($env:RELEASE_VERSION) does not match csproj version $sourceVersion"
          }

      - name: Restore
        run: dotnet restore BetterGenshinImpact.sln

      - name: Build targeted regression tests
        run: >-
          dotnet test Test/BetterGenshinImpact.UnitTest/BetterGenshinImpact.UnitTest.csproj
          --configuration Release --no-restore --filter
          "FullyQualifiedName~GamepadInputBackendTests|FullyQualifiedName~RecognitionProfileResolverTests"

      - name: Publish self-contained Windows package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: >-
          dotnet publish BetterGenshinImpact/BetterGenshinImpact.csproj
          --configuration Release --runtime win-x64
          --self-contained true --property:Platform=x64
          --property:Version=$env:RELEASE_VERSION
          --property:InformationalVersion=$env:RELEASE_VERSION
          --output dist/BetterGI

      - name: Package Windows build
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          Get-ChildItem dist/BetterGI -Recurse -Include *.pdb,*.lib | Remove-Item -Force
          $archive = "dist/BetterGI_v$($env:RELEASE_VERSION)-win-x64.zip"
          Compress-Archive -Path dist/BetterGI/* -DestinationPath $archive -CompressionLevel Optimal

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterGI_${{ needs.validate.outputs.version }}_win-x64
          path: dist/BetterGI_v*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: BetterGI ${{ needs.validate.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.validate.outputs.version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/BetterGI_v*.zip
